<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <!-- Strip the Referer from outbound requests so cross-origin profile photos
         (e.g. Google's lh3.googleusercontent.com, which rejects/ratelimits hotlinks
         that carry a referrer) load everywhere. Auth (Origin header + JWT) and the
         API (Origin-based CORS) don't depend on Referer, so this is safe. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="NextIgnition - The ultimate platform connecting founders, experts, and investors to ignite startup growth." />
    <meta name="theme-color" content="#6666ff" />
    
    <!-- SEO & Social Media Meta Tags -->
    <meta property="og:title" content="NextIgnition - Ignite Your Startup Journey" />
    <meta property="og:description" content="The ultimate platform connecting founders, experts, and investors to ignite startup growth." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nextignition.com" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NextIgnition" />
    <meta name="twitter:description" content="Connecting founders, experts, and investors." />
    <meta name="twitter:image" content="/logo.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>NextIgnition - Ignite Your Startup Journey</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      html, body {
        background-color: #ffffff !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
