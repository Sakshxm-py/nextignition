name: Google Auth Test Suite

on:
  push:
    branches: [main, develop]
    paths: ['backend/**', 'cypress/**']
  pull_request:
    branches: [main]

env:
  JWT_SECRET: ci-test-secret-that-is-at-least-32-chars
  GOOGLE_CLIENT_ID: ci-test-client-id
  ADMIN_JWT_SECRET: ci-admin-secret-32-chars-minimum!!
  ADMIN_CREDENTIALS: admin:password

jobs:
  # ── 1. Lint + Unit + Integration ────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://btxdxwyvloucxdfjlfhb.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0eGR4d3l2bG91Y3hkZmpsZmhiIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MjcxNjA1OCwiZXhwIjoyMDg4MjkyMDU4fQ.3bqRew_ZwhhiFWHQXq3gGMPQic_LdQ5fRATPZ61imq8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Lint
        run: npm run lint --if-present
        working-directory: backend

      # IMPORTANT: Fail if the middleware was accidentally removed
      - name: Verify fix is present in source
        run: grep -r "verifyGoogleIdToken" backend/src/ || (echo "❌ verifyGoogleIdToken not found!" && exit 1)

      - name: Jest unit + integration tests
        run: npx jest --forceExit --detectOpenHandles
        working-directory: backend

  # ── 2. Cypress E2E ──────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install all deps
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Start backend
        run: cd backend && npm run dev &
        env:
          PORT: 5000

      - name: Start frontend
        run: cd frontend && npm run dev &
        env:
          PORT: 5173

      - name: Wait for servers
        run: npx wait-on http://localhost:5000/api/health http://localhost:5173 --timeout 60000

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          install: false
          wait-on: http://localhost:5173
          spec: cypress/e2e/googleAuth.cy.ts

  # ── 3. k6 Load Test ────────────────────────────────────────────────────────
  load:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Start backend
        run: cd backend && npm run dev &
        env:
          PORT: 5000

      - name: Wait for backend
        run: npx wait-on http://localhost:5000/api/health --timeout 30000

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6

      - name: Run k6 load test
        run: |
          if [ -n "$K6_TOKEN" ]; then
            k6 run backend/load-test.js
          else
            echo "Skipping load test because GOOGLE_TEST_TOKEN is not set."
          fi
        env:
          K6_TOKEN: ${{ secrets['GOOGLE_TEST_TOKEN'] }}
